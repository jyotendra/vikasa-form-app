version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend 
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - vikasa-network
    environment:
      - VITE_API_URL=http://backend:8002
      - VITE_LOCALSTACK_ENDPOINT=http://localstack:4566
      - VITE_COGNITO_ENDPOINT=http://cognito:9229

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - vikasa-network
    env_file:
      - ./backend/.env.dev
    environment:
      - DOCKER_UP=1
      - LOCALSTACK_ENDPOINT=http://localstack:4566
      - COGNITO_ENDPOINT=http://cognito:9229
    depends_on:
      - localstack
      - cognito

  localstack:
    container_name: "${LOCALSTACK_DOCKER_NAME:-localstack-main}"
    image: localstack/localstack:4.2
    ports:
      - "127.0.0.1:4566:4566"            # LocalStack Gateway
      - "127.0.0.1:4510-4559:4510-4559"  # external services port range
    environment:
      # LocalStack configuration: https://docs.localstack.cloud/references/configuration/
      - DEBUG=${DEBUG:-0}
      - DYNAMODB_SHARE_DB=1
    volumes:
      - "${LOCALSTACK_VOLUME_DIR:-./volume}:/var/lib/localstack"
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - vikasa-network
    depends_on:
      - cognito

  cognito:
    image: jagregory/cognito-local:latest
    environment:
      - CODE=123456 # https://github.com/jagregory/cognito-local?tab=readme-ov-file#confirmation-codes
    ports:
      - "9229:9229"
    volumes:
      - ./.cognito-local:/app/.cognito
    networks:
      - vikasa-network

networks:
  vikasa-network:
    driver: bridge
